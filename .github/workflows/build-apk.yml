
name: Build RoundMusic APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android project
        run: |
          echo "Repository structure:"
          ls -la
          echo "Finding Gradle wrapper:"
          find . -maxdepth 5 -name gradlew -type f

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
        working-directory: RoundMusic

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoundMusic-APK
          path: RoundMusic/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
